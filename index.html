<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日簽到罐 3.0 - 奇石典藏版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes dropIn {
            0% { transform: translateY(-300px) scale(0.5) rotate(0deg); opacity: 0; }
            60% { transform: translateY(10px) scale(1.1) rotate(180deg); opacity: 1; }
            80% { transform: translateY(-5px) scale(0.95) rotate(220deg); }
            100% { transform: translateY(0) scale(1) rotate(var(--final-rot, 0deg)); opacity: 1; }
        }

        .stone-drop {
            animation: dropIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 石頭形狀裁切定義 */
        .shape-pebble { clip-path: polygon(30% 0%, 70% 10%, 100% 35%, 90% 75%, 65% 100%, 20% 90%, 0% 60%, 10% 25%); }
        .shape-crystal { clip-path: polygon(50% 0%, 90% 20%, 100% 70%, 50% 100%, 0% 70%, 10% 20%); }
        .shape-raw { clip-path: polygon(20% 0%, 80% 10%, 100% 50%, 70% 95%, 15% 85%, 0% 40%); }
        .shape-star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .shape-heart { clip-path: polygon(50% 15%, 65% 0%, 85% 0%, 100% 20%, 100% 45%, 50% 95%, 0% 45%, 0% 20%, 15% 0%, 35% 0%); }

        /* 彩虹流光特效 */
        @keyframes rainbowGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        .rainbow-stone {
            background: linear-gradient(135deg, #f43f5e, #fb923c, #facc15, #4ade80, #38bdf8, #c084fc);
            animation: rainbowGlow 3s linear infinite;
        }

        .jar-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 4px solid rgba(255, 255, 255, 0.6);
            border-top: none;
            border-radius: 0 0 40px 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1), inset 0 0 15px rgba(255,255,255,0.5);
        }

        .jar-lid {
            background: #d1d5db;
            height: 16px;
            border-radius: 8px 8px 0 0;
            margin: 0 auto;
            width: 70%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-3deg); }
            40% { transform: rotate(3deg); }
            60% { transform: rotate(-2deg); }
            80% { transform: rotate(2deg); }
        }
        .shake-jar { animation: shake 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <!-- 頂部導覽列 -->
    <header class="max-w-md mx-auto p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide text-slate-700">💎 奇石簽到罐</h1>
        <div class="flex gap-2">
            <button onclick="openModal('achieve')" class="px-3 py-1.5 bg-white shadow-sm rounded-xl text-xs font-semibold hover:bg-slate-50 transition">🏆 圖鑑</button>
            <button onclick="openModal('history')" class="px-3 py-1.5 bg-white shadow-sm rounded-xl text-xs font-semibold hover:bg-slate-50 transition">📅 紀錄</button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-6">

        <!-- 罐子主體區塊 -->
        <div class="bg-white/80 backdrop-blur rounded-3xl p-6 shadow-xl border border-white/60 relative text-center">
            <div id="jarLid" class="jar-lid mb-1"></div>
            <div id="jar" class="jar-container h-72 w-full flex flex-wrap-reverse content-start p-4 gap-1.5 overflow-y-auto">
                <!-- 石頭會落在此處 -->
            </div>
            
            <p id="counterText" class="mt-4 text-xs font-medium text-slate-500">罐子裡已有 <span id="stoneCount" class="text-slate-800 font-bold">0</span> 顆奇石</p>
        </div>

        <!-- 每日任務區塊 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-slate-700">📋 今日待辦任務</h2>
                <button onclick="addTask()" class="text-xs text-indigo-600 font-semibold hover:underline">+ 新增任務</button>
            </div>
            <div id="taskList" class="space-y-2 mb-4">
                <!-- 任務清單渲染處 -->
            </div>

            <!-- 心情與簽到按鈕 -->
            <input type="text" id="dailyNote" placeholder="寫下一句今日心得..." class="w-full px-3 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 mb-3 focus:outline-none focus:border-indigo-400">
            
            <button id="checkInBtn" onclick="handleCheckIn()" class="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-md hover:bg-indigo-700 active:scale-95 transition">
                完成任務並放入奇石 🪨
            </button>
        </div>

    </main>

    <!-- 通用 Modal 彈窗 -->
    <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-slate-800">標題</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <div id="modalBody" class="overflow-y-auto flex-1 text-xs space-y-2">
                <!-- 彈窗內容 -->
            </div>
        </div>
    </div>

    <script>
        // --- 1. 石頭資料庫定義 ---
        const STONES = {
            // 初始 10 種真實奇石
            base: [
                { name: "鵝卵石", color: "#d1d5db", glow: "transparent", shape: "shape-pebble" },
                { name: "黑曜石", color: "#1f2937", glow: "rgba(0,0,0,0.3)", shape: "shape-raw" },
                { name: "木化石", color: "#78350f", glow: "transparent", shape: "shape-pebble" },
                { name: "玄武岩", color: "#4b5563", glow: "transparent", shape: "shape-raw" },
                { name: "白水晶", color: "#f3f4f6", glow: "rgba(255,255,255,0.8)", shape: "shape-crystal" },
                { name: "紅瑪瑙", color: "#b91c1c", glow: "rgba(185,28,28,0.4)", shape: "shape-crystal" },
                { name: "綠東陵", color: "#047857", glow: "rgba(4,120,87,0.3)", shape: "shape-pebble" },
                { name: "黃水晶", color: "#f59e0b", glow: "rgba(245,158,11,0.4)", shape: "shape-crystal" },
                { name: "藍紋石", color: "#1e3a8a", glow: "rgba(30,58,138,0.4)", shape: "shape-raw" },
                { name: "粉晶",   color: "#f472b6", glow: "rgba(244,114,182,0.4)", shape: "shape-heart" }
            ],
            // 進階成就石
            advanced: [
                { id: "a7Days", name: "紫水晶", color: "#8b5cf6", glow: "rgba(139,92,246,0.6)", shape: "shape-crystal" },
                { id: "a30Days", name: "孔雀石", color: "#065f46", glow: "rgba(6,95,70,0.5)", shape: "shape-pebble" },
                { id: "a100Days", name: "青金石", color: "#1d4ed8", glow: "rgba(29,78,216,0.6)", shape: "shape-raw" },
                { id: "aNight", name: "夜光螢石", color: "#10b981", glow: "rgba(16,185,129,0.8)", shape: "shape-crystal" },
                { id: "aPerfectMonth", name: "金箔黃金石", color: "#fbbf24", glow: "rgba(251,191,36,0.9)", shape: "shape-star" }
            ],
            // 超稀有 3% 彩虹星石
            rareStar: { name: "彩虹流光星石", color: "rainbow", glow: "rgba(255,255,255,0.9)", shape: "shape-star", isRare: true },
            // 特殊節日限定石 (MM-DD 格式)
            holiday: {
                "01-01": { name: "赤金紅包石", color: "#dc2626", glow: "rgba(220,38,38,0.8)", shape: "shape-star" },
                "06-08": { name: "翡翠粽香石", color: "#15803d", glow: "rgba(21,128,61,0.8)", shape: "shape-raw" },
                "09-25": { name: "金桂月餅石", color: "#d97706", glow: "rgba(217,119,6,0.8)", shape: "shape-pebble" },
                "12-25": { name: "雪花冰晶石", color: "#38bdf8", glow: "rgba(56,189,248,0.8)", shape: "shape-crystal" }
            }
        };

        // --- 2. 全局狀態管理 ---
        let state = {
            stones: [],
            tasks: ["完成今日運動", "閱讀 15 分鐘", "喝水 2000c.c"],
            achievements: {},
            lastCheckIn: null
        };

        function loadData() {
            const saved = localStorage.getItem('jar_3_data');
            if (saved) state = JSON.parse(saved);
            renderTasks();
            renderJar();
            checkTodayCheckIn();
        }

        function saveData() {
            localStorage.setItem('jar_3_data', JSON.stringify(state));
        }

        // --- 3. 核心邏輯：抽石與打卡 ---
        function getRandomStone() {
            const today = new Date();
            const dateKey = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            // 1. 節日優先
            if (STONES.holiday[dateKey]) {
                return { ...STONES.holiday[dateKey], isHoliday: true };
            }

            // 2. 3% 獨立機率觸發超稀有彩虹星石
            if (Math.random() < 0.03) {
                return STONES.rareStar;
            }

            // 3. 基礎 + 已解鎖成就池
            let pool = [...STONES.base];
            STONES.advanced.forEach(stone => {
                if (state.achievements[stone.id]) {
                    pool.push(stone);
                }
            });

            return pool[Math.floor(Math.random() * pool.length)];
        }

        function handleCheckIn() {
            const noteInput = document.getElementById('dailyNote');
            const stoneData = getRandomStone();
            const rot = Math.floor(Math.random() * 360);

            const newStone = {
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                note: noteInput.value.trim() || "今天順利完成打卡！",
                stone: stoneData,
                rotation: rot
            };

            state.stones.push(newStone);
            state.lastCheckIn = new Date().toDateString();
            
            checkAchievements();
            saveData();

            noteInput.value = '';
            renderJar();
            checkTodayCheckIn();
            
            const jar = document.getElementById('jar');
            jar.classList.add('shake-jar');
            setTimeout(() => jar.classList.remove('shake-jar'), 500);
        }

        // --- 4. 畫面渲染邏輯 ---
        function renderJar() {
            const jar = document.getElementById('jar');
            jar.innerHTML = '';
            
            state.stones.forEach((item, idx) => {
                const el = document.createElement('div');
                const isLatest = idx === state.stones.length - 1;
                
                el.className = `w-7 h-7 flex-shrink-0 cursor-pointer ${item.stone.shape} ${isLatest ? 'stone-drop' : ''} ${item.stone.isRare ? 'rainbow-stone' : ''}`;
                
                if (!item.stone.isRare) {
                    el.style.backgroundColor = item.stone.color;
                }
                
                el.style.boxShadow = `0 0 10px ${item.stone.glow}`;
                el.style.setProperty('--final-rot', `${item.rotation}deg`);
                el.style.transform = `rotate(${item.rotation}deg)`;
                
                el.title = `${item.date} - ${item.stone.name}`;
                el.onclick = () => showStoneDetail(item);

                jar.appendChild(el);
            });

            document.getElementById('stoneCount').innerText = state.stones.length;
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            state.tasks.forEach((task, idx) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-100";
                item.innerHTML = `
                    <label class="flex items-center gap-2 cursor-pointer text-xs">
                        <input type="checkbox" class="task-check rounded text-indigo-600 focus:ring-0">
                        <span class="text-slate-700">${task}</span>
                    </label>
                    <button onclick="removeTask(${idx})" class="text-slate-300 hover:text-red-400">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function checkTodayCheckIn() {
            const btn = document.getElementById('checkInBtn');
            const isToday = state.lastCheckIn === new Date().toDateString();
            if (isToday) {
                btn.disabled = true;
                btn.innerText = "今日奇石已入罐 ✨";
                btn.className = "w-full py-3 bg-slate-300 text-slate-500 rounded-xl text-sm font-bold cursor-not-allowed";
            }
        }

        // --- 5. 任務管理 ---
        function addTask() {
            const t = prompt("請輸入新增的每日任務：");
            if (t && t.trim()) {
                state.tasks.push(t.trim());
                saveData();
                renderTasks();
            }
        }

        function removeTask(idx) {
            state.tasks.splice(idx, 1);
            saveData();
            renderTasks();
        }

        // --- 6. 成就解鎖判定 ---
        function checkAchievements() {
            const count = state.stones.length;
            const hour = new Date().getHours();

            if (count >= 7) state.achievements['a7Days'] = true;
            if (count >= 30) state.achievements['a30Days'] = true;
            if (count >= 100) state.achievements['a100Days'] = true;
            if (hour >= 23 || hour < 2) state.achievements['aNight'] = true;
        }

        // --- 7. Modal 彈窗介面 ---
        function openModal(type) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            if (type === 'achieve') {
                title.innerText = "🏆 石頭圖鑑與成就";
                body.innerHTML = `
                    <p class="text-slate-500 mb-2">解鎖條件與限定奇石：</p>
                    <div class="space-y-2">
                        <div class="p-2.5 bg-amber-50 border border-amber-200 rounded-xl flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-5 h-5 shape-star rainbow-stone"></div>
                                <span class="font-bold text-amber-800">彩虹流光星石</span>
                            </div>
                            <span class="text-amber-600 font-semibold">3% 超稀有掉落</span>
                        </div>
                        ${STONES.advanced.map(s => `
                            <div class="p-2.5 rounded-xl border ${state.achievements[s.id] ? 'bg-indigo-50/50 border-indigo-200' : 'bg-slate-50 border-slate-100 opacity-60'} flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <div class="w-5 h-5 ${s.shape}" style="background-color:${s.color}"></div>
                                    <span class="font-bold text-slate-700">${s.name}</span>
                                </div>
                                <span class="font-semibold ${state.achievements[s.id] ? 'text-indigo-600' : 'text-slate-400'}">
                                    ${state.achievements[s.id] ? '已解鎖' : '未解鎖'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (type === 'history') {
                title.innerText = "📅 簽到時光膠囊";
                body.innerHTML = state.stones.slice().reverse().map(s => `
                    <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center">
                        <div>
                            <div class="font-bold text-slate-700">${s.date} ${s.time}</div>
                            <div class="text-slate-500 mt-0.5">${s.note}</div>
                        </div>
                        <div class="w-6 h-6 ${s.stone.shape} ${s.stone.isRare ? 'rainbow-stone' : ''}" style="${!s.stone.isRare ? 'background-color:' + s.stone.color : ''}"></div>
                    </div>
                `).join('') || '<p class="text-slate-400 text-center py-4">目前還沒有紀錄喔！</p>';
            }

            modal.classList.remove('hidden');
        }

        function showStoneDetail(item) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.innerText = `${item.stone.name} (${item.date})`;
            body.innerHTML = `
                <div class="text-center py-4 space-y-3">
                    <div class="w-12 h-12 mx-auto ${item.stone.shape} ${item.stone.isRare ? 'rainbow-stone' : ''}" style="${!item.stone.isRare ? 'background-color:' + item.stone.color : ''}; box-shadow: 0 0 15px ${item.stone.glow}"></div>
                    <p class="font-bold text-slate-700 text-sm">${item.stone.isRare ? '⭐ 3% 超稀有彩虹奇石' : item.stone.isHoliday ? '🎉 節日限定奇石' : '典藏奇石'}</p>
                    <p class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-slate-600">${item.note}</p>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        window.onload = loadData;
    </script>
</body>
</html>
