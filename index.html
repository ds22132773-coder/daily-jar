<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>每日簽到玻璃瓶</title>
    <!-- 支援全螢幕 App 模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #f7f9fb;
            --card-bg: #ffffff;
            --text-main: #4a5568;
            --text-sub: #a0aec0;
            --accent: #7c3aed;
            --accent-disabled: #cbd5e1;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .auth-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2d3748;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* 玻璃瓶造型 */
        .jar-container {
            position: relative;
            width: 150px;
            height: 200px;
        }

        .jar-cork {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 14px;
            background: #d4a373;
            border-radius: 4px;
            z-index: 2;
        }

        .jar-body {
            position: absolute;
            top: 4px;
            width: 100%;
            height: 196px;
            background: rgba(255, 255, 255, 0.5);
            border: 3px solid rgba(200, 215, 230, 0.6);
            border-radius: 20px 20px 36px 36px;
            backdrop-filter: blur(4px);
            overflow: hidden;
            box-shadow: inset -6px -6px 12px rgba(0, 0, 0, 0.02), inset 6px 6px 12px rgba(255, 255, 255, 0.8);
        }

        .stones-area {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            height: 170px;
            display: flex;
            flex-wrap: wrap-reverse;
            align-content: flex-start;
            justify-content: center;
            gap: 5px;
            padding: 6px;
        }

        .stone {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.15);
            animation: dropIn 0.4s ease-out;
        }

        @keyframes dropIn {
            0% { transform: translateY(-120px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* 任務區 */
        .task-section {
            width: 100%;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .add-task-form {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .add-task-input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-small {
            padding: 8px 12px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .checkin-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
            cursor: pointer;
        }

        .checkin-btn:disabled {
            background: var(--accent-disabled);
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Google 帳號登入狀態區 -->
    <div class="auth-bar">
        <div class="user-status" id="user-status">☁️ 未同步雲端</div>
        <div id="g_id_onload"
             data-client_id="652129979830-evdic11gb4b61v6aendme725bg9lsvij.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="icon" data-shape="circle"></div>
    </div>

    <header>
        <h1>每日累積瓶</h1>
        <p id="total-count-text">累積石頭：0 顆</p>
    </header>

    <div class="jar-container">
        <div class="jar-cork"></div>
        <div class="jar-body">
            <div class="stones-area" id="stones-area"></div>
        </div>
    </div>

    <div class="task-section">
        <div class="task-header">
            <span>今日任務</span>
            <span id="task-progress" style="color: var(--text-sub);">0/0</span>
        </div>
        <ul class="task-list" id="task-list"></ul>

        <form class="add-task-form" id="add-task-form">
            <input type="text" class="add-task-input" id="task-input" placeholder="新增任務..." required>
            <button type="submit" class="btn-small">新增</button>
        </form>
    </div>

    <button class="checkin-btn" id="checkin-btn" disabled>請先完成所有任務</button>
</div>

<script>
    const STORAGE_KEY = 'daily_jar_data_v2';
    const stoneColors = ['#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA', '#F6A6FF', '#AFCBFF', '#FFC6FF'];

    let state = {
        userEmail: '',
        lastCheckInDate: '',
        stones: [],
        tasks: [
            { id: '1', text: '喝足 2000cc 水', completed: false },
            { id: '2', text: '運動或拉筋 15 分鐘', completed: false }
        ]
    };

    function init() {
        loadData();
        checkDateReset();
        render();
        setupEventListeners();
    }

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    function checkDateReset() {
        if (state.lastCheckInDate !== getTodayString()) {
            state.tasks.forEach(t => t.completed = false);
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (state.userEmail) {
            localStorage.setItem(`cloud_backup_${state.userEmail}`, JSON.stringify(state));
        }
    }

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try { state = JSON.parse(saved); } catch (e) {}
        }
    }

    function handleCredentialResponse(response) {
        const responsePayload = parseJwt(response.credential);
        state.userEmail = responsePayload.email;
        
        document.getElementById('user-status').innerText = `☁️ 已同步：${responsePayload.given_name || '雲端用戶'}`;

        const cloudData = localStorage.getItem(`cloud_backup_${state.userEmail}`);
        if (cloudData) {
            const parsed = JSON.parse(cloudData);
            if (parsed.stones.length >= state.stones.length) {
                state = parsed;
            }
        }
        saveData();
        render();
    }

    function parseJwt(token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    function render() {
        const today = getTodayString();
        const isCheckedInToday = state.lastCheckInDate === today;

        const stonesArea = document.getElementById('stones-area');
        stonesArea.innerHTML = '';
        state.stones.forEach(color => {
            const stone = document.createElement('div');
            stone.className = 'stone';
            stone.style.backgroundColor = color;
            stonesArea.appendChild(stone);
        });

        document.getElementById('total-count-text').innerText = `累積石頭：${state.stones.length} 顆`;

        const taskList = document.getElementById('task-list');
        taskList.innerHTML = '';
        let completedCount = 0;

        state.tasks.forEach(task => {
            if (task.completed) completedCount++;
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <div style="display:flex;align-items:center;gap:8px;">
                    <input type="checkbox" class="task-checkbox" data-id="${task.id}" ${task.completed ? 'checked' : ''} ${isCheckedInToday ? 'disabled' : ''}>
                    <span>${escapeHtml(task.text)}</span>
                </div>
                <button class="delete-btn" data-id="${task.id}">&times;</button>
            `;
            taskList.appendChild(li);
        });

        document.getElementById('task-progress').innerText = `${completedCount}/${state.tasks.length}`;

        const checkinBtn = document.getElementById('checkin-btn');
        const allDone = state.tasks.length > 0 && completedCount === state.tasks.length;

        if (isCheckedInToday) {
            checkinBtn.disabled = true;
            checkinBtn.innerText = '今天已完成，明天再來！';
        } else if (allDone) {
            checkinBtn.disabled = false;
            checkinBtn.innerText = '任務完成，投進石頭！';
        } else {
            checkinBtn.disabled = true;
            checkinBtn.innerText = '完成所有任務以簽到';
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function setupEventListeners() {
        document.getElementById('add-task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('task-input');
            if (input.value.trim()) {
                state.tasks.push({ id: Date.now().toString(), text: input.value.trim(), completed: false });
                input.value = '';
                saveData();
                render();
            }
        });

        document.getElementById('task-list').addEventListener('click', (e) => {
            const id = e.target.getAttribute('data-id');
            if (!id) return;
            if (e.target.classList.contains('task-checkbox')) {
                const task = state.tasks.find(t => t.id === id);
                if (task) { task.completed = e.target.checked; saveData(); render(); }
            }
            if (e.target.classList.contains('delete-btn')) {
                state.tasks = state.tasks.filter(t => t.id !== id);
                saveData(); render();
            }
        });

        document.getElementById('checkin-btn').addEventListener('click', () => {
            if (state.lastCheckInDate === getTodayString()) return;
            const randomColor = stoneColors[Math.floor(Math.random() * stoneColors.length)];
            state.stones.push(randomColor);
            state.lastCheckInDate = getTodayString();
            saveData();
            render();
        });
    }

    init();
</script>
</body>
</html>
