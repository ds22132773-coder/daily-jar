<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>習慣養成：石頭圖鑑與成就系統</title>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --primary-color: #4a5568;
      --accent-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #2d3748;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 900px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 瓶子視覺區域 */
    .jar-container {
      width: 180px;
      height: 240px;
      border: 4px solid #a0aec0;
      border-radius: 20px 20px 40px 40px;
      position: relative;
      background: rgba(255, 255, 255, 0.6);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap-reverse;
      align-content: flex-start;
      padding: 10px;
      gap: 6px;
      margin: 15px 0;
    }

    .jar-lid {
      width: 120px;
      height: 16px;
      background: #718096;
      border-radius: 8px;
      margin-bottom: -6px;
      z-index: 2;
    }

    .stone-item {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2), 1px 1px 3px rgba(0,0,0,0.1);
      animation: dropIn 0.4s ease-out;
    }

    @keyframes dropIn {
      0% { transform: translateY(-150px) scale(0.5); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    button {
      background-color: #4a5568;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    button:hover { background-color: #2d3748; }
    button:active { transform: scale(0.98); }

    /* 圖鑑區塊 */
    .dex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      width: 100%;
      margin-top: 10px;
    }

    .dex-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      background: #f8fafc;
      font-size: 0.85rem;
      opacity: 0.4;
      filter: grayscale(100%);
      transition: all 0.3s;
    }

    .dex-card.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      background: #fff;
      border-color: #cbd5e0;
    }

    .dex-stone-preview {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin: 0 auto 6px auto;
    }

    /* 彈窗Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      padding: 24px;
      border-radius: 20px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal-stone {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 15px auto;
    }
  </style>
</head>
<body>

  <h1>🪨 每日習慣：石頭圖鑑與收集</h1>

  <div class="container">
    <!-- 打卡與瓶子區 -->
    <div class="card">
      <div class="jar-lid"></div>
      <div class="jar-container" id="jar"></div>
      <p>已累積石頭：<b id="stoneCount">0</b> 顆</p>
      <button onclick="checkIn()">完成今日記錄（抽石頭）</button>
    </div>

    <!-- 圖鑑區 -->
    <div class="card">
      <h3>📖 初階石頭圖鑑 (<span id="unlockedCount">0</span>/10)</h3>
      <div class="dex-grid" id="dexGrid"></div>
    </div>
  </div>

  <!-- 解鎖新石頭彈窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">🆕 解鎖新石頭！</h2>
      <div class="modal-stone" id="modalStone"></div>
      <h3 id="modalStoneName"></h3>
      <p id="modalStory" style="font-size: 0.9rem; color: #4a5568; line-height: 1.4;"></p>
      <button onclick="closeModal()">收進瓶子裡</button>
    </div>
  </div>

  <script>
    // 10 款初階石頭資料庫
    const STONES_DB = [
      { id: 'pebble', name: '鵝卵石', color: '#d3d3d3', symbol: '平穩起步', story: '【河流的洗禮】水流翻滾千萬次磨去了尖角。剛開始培養習慣不必急，順著節奏就能漸入佳境！' },
      { id: 'basalt', name: '玄武岩', color: '#4a4a4a', symbol: '穩固基石', story: '【地殼的底座】火山岩漿噴出後冷卻形成，頂起了整座海洋，象徵你每天默默累積的基礎力量。' },
      { id: 'sandstone', name: '砂岩', color: '#d2b48c', symbol: '粒粒累積', story: '【風沙的堆疊】無數微小的沙粒擠壓凝結而成。每一粒沙都很小，但疊加起來就能成為宏偉峽谷！' },
      { id: 'opal', name: '蛋白石碎片', color: '#e6f2ff', symbol: '初露光芒', story: '【微光的沉澱】二氧化矽與水在岩石縫隙中沉澱，能在光線下折射出淡淡彩光，象徵潛力開始發光！' },
      { id: 'flint', name: '燧石', color: '#5c6b73', symbol: '點燃契機', story: '【文明的火花】古人敲擊取火的石材。代表每一次開始行動，都是點燃改變生活的關鍵火種。' },
      { id: 'rose_quartz', name: '玫瑰石英', color: '#ffb6c1', symbol: '自我獎勵', story: '【溫柔的結晶】含微量鈦元素而呈現粉紅色。代表在追求目標的同時，也別忘了對自己溫柔。' },
      { id: 'mica', name: '雲母片岩', color: '#c0c0c0', symbol: '閃耀思緒', story: '【層層閃耀】多種礦物在高壓下排列而成，片狀結構在光線下會閃閃發亮，象徵隨手記錄下的靈感！' },
      { id: 'peridot', name: '橄欖石', color: '#90ee90', symbol: '生機蓬勃', story: '【來自地幔的綠意】誕生於地底極深處的礦物，帶有植物般的生機綠意，象徵你的新習慣正在茁壯發芽。' },
      { id: 'pumice', name: '浮石', color: '#e5e5e5', symbol: '輕盈無壓', story: '【會漂浮的石頭】火山噴發時氣泡被封存在岩石中形成的極輕石頭。提醒你打卡是件輕鬆無壓力的事！' },
      { id: 'quartz', name: '石英晶簇', color: '#ffffff', symbol: '清晰思緒', story: '【純粹的幾何】高溫高壓下緩慢生長出的完美晶體，象徵你在每天的記錄中理清的條理與思緒。' }
    ];

    // 玩家進度資料
    let userStats = {
      inventory: [], // 獲得的石頭歷史
      unlocked: {}   // 解鎖狀況 { pebble: 數量, basalt: 數量 }
    };

    // 初始化頁面
    function init() {
      renderDex();
    }

    // 渲染圖鑑介面
    function renderDex() {
      const dexGrid = document.getElementById('dexGrid');
      dexGrid.innerHTML = '';
      let unlockedCount = 0;

      STONES_DB.forEach(stone => {
        const count = userStats.unlocked[stone.id] || 0;
        const isUnlocked = count > 0;
        if (isUnlocked) unlockedCount++;

        const card = document.createElement('div');
        card.className = `dex-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
          <div class="dex-stone-preview" style="background-color: ${stone.color}; border: 1px solid #ccc;"></div>
          <div><b>${stone.name}</b></div>
          <div style="font-size:0.75rem; color:#718096;">${isUnlocked ? `擁有: ${count}` : '未解鎖'}</div>
        `;
        dexGrid.appendChild(card);
      });

      document.getElementById('unlockedCount').innerText = unlockedCount;
    }

    // 打卡邏輯：隨機抽卡
    function checkIn() {
      // 隨機抽取一款石頭
      const randomIndex = Math.floor(Math.random() * STONES_DB.length);
      const drawnStone = STONES_DB[randomIndex];

      const isFirstTime = !userStats.unlocked[drawnStone.id];
      userStats.unlocked[drawnStone.id] = (userStats.unlocked[drawnStone.id] || 0) + 1;
      userStats.inventory.push(drawnStone);

      // 時間判定（彩蛋）
      checkHiddenAchievements();

      // 畫面視覺更新
      addStoneToJar(drawnStone.color);
      renderDex();

      // 如果是第一次獲得，跳出圖鑑解鎖卡片
      if (isFirstTime) {
        showModal("🆕 解鎖新石頭圖鑑！", drawnStone);
      }
    }

    // 石頭落入瓶子視覺
    function addStoneToJar(color) {
      const jar = document.getElementById('jar');
      const stoneEl = document.createElement('div');
      stoneEl.className = 'stone-item';
      stoneEl.style.backgroundColor = color;
      jar.appendChild(stoneEl);

      document.getElementById('stoneCount').innerText = userStats.inventory.length;
    }

    // 隱藏成就檢查（彩蛋）
    function checkHiddenAchievements() {
      const now = new Date();
      const hour = now.getHours();

      if (hour >= 1 && hour < 4) {
        console.log("🌙 觸發隱藏成就：夜貓子！");
      } else if (hour >= 5 && hour < 7) {
        console.log("🌅 觸發隱藏成就：晨型人！");
      }
    }

    // 顯示解鎖 Modal
    function showModal(title, stone) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalStoneName').innerText = `${stone.name} (${stone.symbol})`;
      document.getElementById('modalStory').innerText = stone.story;
      
      const modalStone = document.getElementById('modalStone');
      modalStone.style.backgroundColor = stone.color;
      modalStone.style.border = '2px solid #cbd5e0';

      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // 啟動頁面
    init();
  </script>
</body>
</html>
