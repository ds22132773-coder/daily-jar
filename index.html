<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>每日簽到罐</title>
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIu^{-}$9oeeI签到罐",      "short_name": "簽到罐",      "start_url": ".",      "display": "standalone",      "background_color": "#f8fafc",      "theme_color": "#4f46e5"    }">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @keyframes dropIn {
      0% { transform: translateY(-180px) scale(0.6) rotate(-10deg); opacity: 0; }
      70% { transform: translateY(10px) scale(1.05) rotate(5deg); opacity: 1; }
      100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-drop { animation: dropIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .jar-mask { clip-path: polygon(10% 0%, 90% 0%, 100% 15%, 100% 100%, 0% 100%, 0% 15%); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans select-none">

  <!-- 頂部資訊欄 -->
  <header class="w-full max-w-sm flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
    <div>
      <h1 class="text-xl font-bold text-slate-800 tracking-wide">每日簽到罐</h1>
      <p id="user-status" class="text-xs text-slate-400 mt-0.5">未登入 (資料儲存於此裝置)</p>
    </div>
    <div id="g_id_onload"
         data-client_id="652129979830-9jpono39nalk4oiac20d707ga2p7n8s1.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div id="login-btn-container" class="g_id_signin" data-type="icon" data-shape="circle" data-theme="outline"></div>
    <div id="user-avatar" class="hidden w-10 h-10 rounded-full border-2 border-indigo-500 overflow-hidden shadow-sm">
      <img id="avatar-img" src="" alt="User" class="w-full h-full object-cover">
    </div>
  </header>

  <!-- 罐子主體區塊 -->
  <main class="relative w-full max-w-sm h-80 my-auto flex items-end justify-center">
    <div class="relative w-64 h-72 border-4 border-slate-700/80 rounded-b-3xl bg-white/40 backdrop-blur-md shadow-lg overflow-hidden flex flex-col justify-end p-3">
      <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-48 h-3 bg-slate-300 rounded-full border border-slate-400/50 z-20"></div>
      <div id="jar-content" class="w-full h-full flex flex-wrap-reverse content-start justify-center gap-2 overflow-y-auto pt-4 no-scrollbar"></div>
    </div>
  </main>

  <!-- 底部控制區塊 -->
  <footer class="w-full max-w-sm flex flex-col items-center gap-3 mb-2">
    <div class="flex items-center justify-between w-full px-2 text-slate-600 font-medium">
      <span>已累積石頭：</span>
      <span class="text-2xl font-black text-indigo-600" id="stone-count">0</span>
    </div>
    <button id="checkin-btn" onclick="addStone()" class="w-full py-4 bg-indigo-600 active:bg-indigo-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center gap-2">
      <span>🪨 丟入今日石頭</span>
    </button>
  </footer>

  <script>
    const COLORS = ['#f87171', '#fb923c', '#fbbf24', '#34d399', '#38bdf8', '#818cf8', '#c084fc', '#f472b6'];
    let state = { count: 0, lastDate: "", stones: [] };
    let currentUser = null;

    function init() {
      const saved = localStorage.getItem('daily_jar_data');
      if (saved) {
        state = JSON.parse(saved);
        renderStones();
      }
      checkTodayStatus();
    }

    function checkTodayStatus() {
      const today = new Date().toLocaleDateString();
      const btn = document.getElementById('checkin-btn');
      if (state.lastDate === today) {
        btn.disabled = true;
        btn.classList.replace('bg-indigo-600', 'bg-slate-300');
        btn.classList.remove('shadow-indigo-200', 'active:scale-95');
        btn.innerHTML = '<span>✅ 今日已簽到</span>';
      }
    }

    function addStone() {
      const today = new Date().toLocaleDateString();
      if (state.lastDate === today) return;

      const randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      const randomShape = Math.floor(Math.random() * 3); 
      
      state.count += 1;
      state.lastDate = today;
      state.stones.push({ color: randomColor, shape: randomShape });

      saveData();
      renderStones(true);
      checkTodayStatus();
    }

    function renderStones(animateLast = false) {
      const container = document.getElementById('jar-content');
      document.getElementById('stone-count').innerText = state.count;
      container.innerHTML = '';

      state.stones.forEach((stone, index) => {
        const el = document.createElement('div');
        let shapeClass = 'rounded-full';
        if (stone.shape === 1) shapeClass = 'rounded-lg transform rotate-12';
        if (stone.shape === 2) shapeClass = 'rounded-2xl transform -rotate-6';

        el.className = `w-10 h-10 ${shapeClass} shadow-md border border-black/10 flex-shrink-0`;
        el.style.backgroundColor = stone.color;

        if (animateLast && index === state.stones.length - 1) {
          el.classList.add('animate-drop');
        }
        container.appendChild(el);
      });
    }

    function saveData() {
      localStorage.setItem('daily_jar_data', JSON.stringify(state));
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      currentUser = data;
      document.getElementById('user-status').innerText = `已同步：${data.name}`;
      document.getElementById('login-btn-container').classList.add('hidden');
      const avatarContainer = document.getElementById('user-avatar');
      document.getElementById('avatar-img').src = data.picture;
      avatarContainer.classList.remove('hidden');
    }

    window.onload = init;
  </script>
</body>
</html>
