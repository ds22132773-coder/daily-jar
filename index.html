<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- 防快取設定，確保每次開啟都載入最新版 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>每日簽到罐</title>
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuaWueWPo+eUn+iXhuW3rCIsCiAgInNob3J0X25hbWUiOiAi5Lnv5oee5qGIIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmOGZhZmMiLAogICJ0aGVtZV9jb2xvciI6ICI0ZjQ2ZTUiCn0=">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes dropIn {
      0% { transform: translateY(-180px) scale(0.6) rotate(-10deg); opacity: 0; }
      70% { transform: translateY(10px) scale(1.05) rotate(5deg); opacity: 1; }
      100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-drop { animation: dropIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans select-none">

  <!-- 頂部資訊與備份列 -->
  <header class="w-full max-w-sm flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
    <div>
      <h1 class="text-xl font-bold text-slate-800 tracking-wide">每日簽到罐</h1>
      <p id="user-status" class="text-xs text-slate-400 mt-0.5">記錄每天的小成就</p>
    </div>
    <div class="flex gap-2">
      <button onclick="exportData()" title="備份" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 text-sm font-medium px-3">
        📤 備份
      </button>
      <label title="還原" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 text-sm font-medium px-3 cursor-pointer">
        📥 還原 <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
      </label>
    </div>
  </header>

  <!-- 罐子主體區塊 -->
  <main class="relative w-full max-w-sm h-80 my-auto flex items-end justify-center">
    <div class="relative w-64 h-72 border-4 border-slate-700/80 rounded-b-3xl bg-white/60 backdrop-blur-md shadow-lg overflow-hidden flex flex-col justify-end p-3">
      <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-48 h-3 bg-slate-300 rounded-full border border-slate-400/50 z-20"></div>
      <div id="jar-content" class="w-full h-full flex flex-wrap-reverse content-start justify-center gap-2 overflow-y-auto pt-4 no-scrollbar"></div>
    </div>
  </main>

  <!-- 底部控制區塊：新增任務與簽到按鈕 -->
  <footer class="w-full max-w-sm flex flex-col items-center gap-3 mb-2">
    <!-- ✏️ 新增任務輸入框 -->
    <div class="w-full">
      <label for="task-input" class="block text-xs font-semibold text-slate-500 mb-1 ml-1">今日完成的任務：</label>
      <input type="text" id="task-input" placeholder="例如：運動30分鐘、閱讀..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white text-slate-800 shadow-sm">
    </div>

    <!-- 石頭數量計數 -->
    <div class="flex items-center justify-between w-full px-2 text-slate-600 font-medium">
      <span>已累積石頭：</span>
      <span class="text-2xl font-black text-indigo-600" id="stone-count">0</span>
    </div>

    <!-- 丟入石頭按鈕 -->
    <button id="checkin-btn" onclick="addStone()" class="w-full py-4 bg-indigo-600 active:bg-indigo-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center gap-2">
      <span>🪨 完成任務並丟入石頭</span>
    </button>
  </footer>

  <script>
    const COLORS = ['#f87171', '#fb923c', '#fbbf24', '#34d399', '#38bdf8', '#818cf8', '#c084fc', '#f472b6'];
    let state = { count: 0, lastDate: "", stones: [] };

    function init() {
      const saved = localStorage.getItem('daily_jar_data');
      if (saved) {
        state = JSON.parse(saved);
        renderStones();
      }
      checkTodayStatus();
    }

    function checkTodayStatus() {
      const today = new Date().toLocaleDateString();
      const btn = document.getElementById('checkin-btn');
      const input = document.getElementById('task-input');
      if (state.lastDate === today) {
        btn.disabled = true;
        input.disabled = true;
        input.value = "";
        input.placeholder = "🎉 今日任務已完成！明天繼續加油！";
        btn.classList.replace('bg-indigo-600', 'bg-slate-300');
        btn.classList.remove('shadow-indigo-200', 'active:scale-95');
        btn.innerHTML = '<span>✅ 今日已簽到</span>';
      }
    }

    function addStone() {
      const today = new Date().toLocaleDateString();
      if (state.lastDate === today) return;

      const input = document.getElementById('task-input');
      const taskText = input.value.trim() || "每日簽到";

      const randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      const randomShape = Math.floor(Math.random() * 3); 
      
      state.count += 1;
      state.lastDate = today;
      state.stones.push({ color: randomColor, shape: randomShape, task: taskText });

      saveData();
      renderStones(true);
      checkTodayStatus();
    }

    function renderStones(animateLast = false) {
      const container = document.getElementById('jar-content');
      document.getElementById('stone-count').innerText = state.count;
      container.innerHTML = '';

      state.stones.forEach((stone, index) => {
        const el = document.createElement('div');
        let shapeClass = 'rounded-full';
        if (stone.shape === 1) shapeClass = 'rounded-lg transform rotate-12';
        if (stone.shape === 2) shapeClass = 'rounded-2xl transform -rotate-6';

        el.className = `w-10 h-10 ${shapeClass} shadow-md border border-black/10 flex-shrink-0 cursor-pointer transition-transform hover:scale-110`;
        el.style.backgroundColor = stone.color;
        if (stone.task) el.title = stone.task;

        // 點擊石頭會彈出當天完成的任務內容
        el.onclick = () => {
          if (stone.task) alert(`🪨 這顆石頭紀錄著：\n「${stone.task}」`);
        };

        if (animateLast && index === state.stones.length - 1) {
          el.classList.add('animate-drop');
        }
        container.appendChild(el);
      });
    }

    function saveData() {
      localStorage.setItem('daily_jar_data', JSON.stringify(state));
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `daily_jar_backup_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          state = JSON.parse(e.target.result);
          saveData();
          renderStones();
          checkTodayStatus();
          alert('資料還原成功！');
        } catch (err) {
          alert('檔案格式錯誤！');
        }
      };
      reader.readAsText(file);
    }

    window.onload = init;
  </script>
</body>
</html>
