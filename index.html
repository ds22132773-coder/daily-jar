<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日簽到石頭與任務筆記系統</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --accent-color: #6c5ce7;
      --accent-hover: #5b4bc4;
      --text-color: #2d3436;
      --text-secondary: #636e72;
      --border-color: #e9ecef;
      --input-bg: #f1f3f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .full-width {
      grid-column: 1 / -1;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* 按鈕樣式 */
    .btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
    }

    .btn:disabled {
      background-color: #ced4da;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Canvas 簽到區域 */
    .checkin-zone {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    #stoneCanvas {
      background: #fafafa;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    /* 統計數字 */
    .stats-group {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-top: 10px;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* 列表樣式 (任務與筆記) */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"], textarea {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      background: #fff;
    }

    ul {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }

    li {
      background: #f8f9fa;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    li.completed span {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff7675;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      transition: opacity 0.2s;
    }

    .delete-btn:hover {
      opacity: 0.7;
    }

    /* 石頭圖鑑網格 */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 12px;
      max-height: 220px;
      overflow-y: auto;
      padding: 5px;
    }

    .gallery-item {
      background: #ffffff;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      font-size: 0.75rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    /* 成就標籤 */
    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      background: #e9ecef;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .badge.unlocked {
      background: #e0e7ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 1. 每日簽到卡片 -->
  <div class="card">
    <h2>🪨 每日採集簽到</h2>
    <div class="checkin-zone">
      <canvas id="stoneCanvas" width="120" height="120"></canvas>
      <div id="stoneResultText" style="height: 24px; font-weight: bold;"></div>
      <button id="checkInBtn" class="btn">每日採集石頭</button>

      <div class="stats-group">
        <div class="stat-item">
          <div class="stat-value" id="streakDays">0</div>
          <div class="stat-label">連續簽到</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalDays">0</div>
          <div class="stat-label">累計簽到</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stoneCount">0</div>
          <div class="stat-label">收集石頭</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 待辦任務卡片 -->
  <div class="card">
    <h2>✅ 每日任務清單</h2>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="新增任務...">
      <button id="addTaskBtn" class="btn">新增</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <!-- 3. 隨手筆記卡片 -->
  <div class="card">
    <h2>📝 筆記與心得</h2>
    <div class="input-group">
      <input type="text" id="noteInput" placeholder="寫下今天的心情或記事...">
      <button id="addNoteBtn" class="btn">紀錄</button>
    </div>
    <ul id="noteList"></ul>
  </div>

  <!-- 4. 已解鎖成就卡片 -->
  <div class="card">
    <h2>🏆 我的成就</h2>
    <div class="badge-list" id="achievementList"></div>
  </div>

  <!-- 5. 石頭圖鑑庫存 (全寬) -->
  <div class="card full-width">
    <h2>📦 採集圖鑑與庫存</h2>
    <div class="gallery-grid" id="stoneGallery"></div>
  </div>

</div>

<script>
// ==========================================
// 1. 石頭與成就資料庫定義
// ==========================================
const STONES = {
  RIVER_PEBBLE: { id: 'RIVER_PEBBLE', name: '河床鵝卵石', shape: 'pebble', color: '#9E9E9E' },
  ROSE_QUARTZ:  { id: 'ROSE_QUARTZ',  name: '粉晶',       shape: 'pebble', color: '#F48FB1', glow: 'rgba(244,143,177,0.5)' },
  AMETHYST:     { id: 'AMETHYST',     name: '紫水晶',     shape: 'crystal',color: '#9C27B0', glow: 'rgba(156,39,176,0.6)' },
  OPAL:         { id: 'OPAL',         name: '彩虹蛋白石', shape: 'heptagon',color: '#80DEEA', glow: 'rgba(0,188,212,0.8)' },
  METEORITE:    { id: 'METEORITE',    name: '黑玻璃隕石', shape: 'nugget', color: '#4A148C', glow: 'rgba(103,58,183,0.6)' },
  
  // 成就/節日解鎖石頭
  CHRONO_METEOR:{ id: 'CHRONO_METEOR',name: '時空隕石',   shape: 'heptagon',color: '#3F51B5', glow: 'rgba(63,81,181,0.8)' },
  GOLD_NUGGET:  { id: 'GOLD_NUGGET',  name: '黃金狗頭金', shape: 'nugget', color: '#FFB300', glow: 'rgba(255,179,0,0.8)' },
  FLUORITE:     { id: 'FLUORITE',     name: '夜光螢石',   shape: 'octahedron',color: '#00C853', glow: 'rgba(0,200,83,0.8)', pulse: true },
  SUPER_SEVEN:  { id: 'SUPER_SEVEN',  name: '超七水晶',   shape: 'crystal',color: '#7B1FA2', glow: 'rgba(123,31,162,0.7)' },
  NEW_YEAR_STAR:{ id: 'NEW_YEAR_STAR',name: '新年星輝石', shape: 'star',   color: '#FF4081', glow: 'rgba(255,64,129,0.9)' },
  GHOST_STONE:  { id: 'GHOST_STONE',  name: '幽靈陰陽石', shape: 'teardrop',color: '#673AB7', glow: 'rgba(103,58,183,0.8)' },
  XMAS_CRYSTAL: { id: 'XMAS_CRYSTAL', name: '聖誕結晶石', shape: 'snowflake',color: '#00BCD4', glow: 'rgba(0,188,212,0.9)' }
};

const ACHIEVEMENTS = [
  { id: 'ACH_7_DAYS', name: '持之以恆 (7天連簽)' },
  { id: 'ACH_30_DAYS', name: '積少成多 (累簽30天)' },
  { id: 'ACH_NIGHT_5', name: '夜貓子 (深夜5次)' },
  { id: 'ACH_NEW_YEAR', name: '跨年紀念 (1/1)' },
  { id: 'ACH_XMAS', name: '聖誕祝福 (12/25)' }
];

// ==========================================
// 2. 狀態管理 (Local Storage)
// ==========================================
let state = {
  userProgress: {
    totalDays: 0,
    streakDays: 0,
    nightCount: 0,
    lastCheckInDate: null,
    unlockedAchievements: [],
    collectedStones: []
  },
  tasks: [],
  notes: []
};

function loadState() {
  const saved = localStorage.getItem('stone_app_state');
  if (saved) {
    state = JSON.parse(saved);
  }
}

function saveState() {
  localStorage.setItem('stone_app_state', JSON.stringify(state));
}

// ==========================================
// 3. Canvas 石頭繪製引擎
// ==========================================
let animFrameId = null;
function drawStone(ctx, x, y, radius, stoneConfig, time = 0) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  if (!stoneConfig) return;

  ctx.save();
  ctx.translate(x, y);

  if (stoneConfig.glow) {
    let glowAlpha = 1;
    if (stoneConfig.pulse) {
      glowAlpha = (Math.sin(time / 200) + 1) / 2 * 0.5 + 0.5;
    }
    ctx.shadowColor = stoneConfig.glow;
    ctx.shadowBlur = 15 * glowAlpha;
  }

  ctx.fillStyle = stoneConfig.color;
  ctx.beginPath();

  switch (stoneConfig.shape) {
    case 'pebble':
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      break;

    case 'crystal':
      ctx.moveTo(0, -radius * 1.3);
      ctx.lineTo(radius * 0.7, -radius * 0.4);
      ctx.lineTo(radius * 0.6, radius);
      ctx.lineTo(-radius * 0.6, radius);
      ctx.lineTo(-radius * 0.7, -radius * 0.4);
      break;

    case 'octahedron':
      ctx.moveTo(0, -radius * 1.2);
      ctx.lineTo(radius * 0.8, 0);
      ctx.lineTo(0, radius * 1.2);
      ctx.lineTo(-radius * 0.8, 0);
      break;

    case 'nugget':
      const pts = [[0, -1], [0.8, -0.7], [1.1, 0.1], [0.6, 0.9], [-0.4, 1.0], [-1.0, 0.3], [-0.7, -0.8]];
      pts.forEach(([px, py], i) => {
        const rx = px * radius, ry = py * radius;
        if (i === 0) ctx.moveTo(rx, ry);
        else ctx.lineTo(rx, ry);
      });
      break;

    case 'star':
      for (let i = 0; i < 10; i++) {
        const r = (i % 2 === 0) ? radius * 1.1 : radius * 0.5;
        const angle = (i * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
      }
      break;

    case 'teardrop':
      ctx.moveTo(0, -radius * 1.2);
      ctx.bezierCurveTo(radius * 1.2, -radius * 0.2, radius * 0.8, radius, 0, radius);
      ctx.bezierCurveTo(-radius * 0.8, radius, -radius * 1.2, -radius * 0.2, 0, -radius * 1.2);
      break;

    case 'snowflake':
      for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI) / 3;
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.strokeStyle = stoneConfig.color;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
      return;

    case 'heptagon':
    default:
      for (let i = 0; i < 7; i++) {
        const angle = (i * 2 * Math.PI) / 7;
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      break;
  }

  ctx.closePath();
  ctx.fill();

  // 高光效果
  ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.beginPath();
  ctx.arc(-radius * 0.2, -radius * 0.3, radius * 0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function renderCanvas(stoneConfig) {
  const canvas = document.getElementById('stoneCanvas');
  const ctx = canvas.getContext('2d');
  
  if (animFrameId) cancelAnimationFrame(animFrameId);

  function loop(time) {
    drawStone(ctx, canvas.width / 2, canvas.height / 2, 35, stoneConfig, time);
    if (stoneConfig && stoneConfig.pulse) {
      animFrameId = requestAnimationFrame(loop);
    }
  }
  loop(0);
}

// ==========================================
// 4. 簽到與抽獎邏輯
// ==========================================
function getDailyStone(now = new Date()) {
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const h = now.getHours();
  const isNight = (h >= 23 || h < 2);

  if (m === 1 && d === 1) return STONES.NEW_YEAR_STAR;
  if (m === 12 && d === 25) return STONES.XMAS_CRYSTAL;
  if (Math.random() < 0.03) return STONES.OPAL;

  if (isNight) {
    if (state.userProgress.unlockedAchievements.includes('ACH_NIGHT_5') && Math.random() < 0.25) {
      return STONES.FLUORITE;
    }
    if (Math.random() < 0.5) return STONES.METEORITE;
  }

  if (state.userProgress.unlockedAchievements.includes('ACH_30_DAYS') && Math.random() < 0.05) {
    return STONES.GOLD_NUGGET;
  }
  if (state.userProgress.unlockedAchievements.includes('ACH_7_DAYS') && Math.random() < 0.08) {
    return STONES.CHRONO_METEOR;
  }

  const pool = [STONES.RIVER_PEBBLE, STONES.ROSE_QUARTZ, STONES.AMETHYST];
  return pool[Math.floor(Math.random() * pool.length)];
}

function handleCheckIn() {
  const now = new Date();
  const todayStr = now.toDateString();

  if (state.userProgress.lastCheckInDate === todayStr) {
    alert('今天已經完成採集囉！明天再來吧！');
    return;
  }

  // 更新簽到天數
  state.userProgress.totalDays++;
  state.userProgress.streakDays++;
  state.userProgress.lastCheckInDate = todayStr;

  const h = now.getHours();
  if (h >= 23 || h < 2) {
    state.userProgress.nightCount++;
  }

  // 檢查成就
  if (state.userProgress.streakDays >= 7 && !state.userProgress.unlockedAchievements.includes('ACH_7_DAYS')) {
    state.userProgress.unlockedAchievements.push('ACH_7_DAYS');
  }
  if (state.userProgress.totalDays >= 30 && !state.userProgress.unlockedAchievements.includes('ACH_30_DAYS')) {
    state.userProgress.unlockedAchievements.push('ACH_30_DAYS');
  }
  if (state.userProgress.nightCount >= 5 && !state.userProgress.unlockedAchievements.includes('ACH_NIGHT_5')) {
    state.userProgress.unlockedAchievements.push('ACH_NIGHT_5');
  }

  // 獲得石頭
  const stone = getDailyStone(now);
  state.userProgress.collectedStones.push({ ...stone, obtainedAt: new Date().toLocaleDateString() });

  saveState();
  updateUI();
  
  // 播放動畫
  renderCanvas(stone);
  document.getElementById('stoneResultText').innerText = `獲得：${stone.name}！`;
}

// ==========================================
// 5. 任務與筆記邏輯
// ==========================================
function addTask() {
  const input = document.getElementById('taskInput');
  if (!input.value.trim()) return;
  state.tasks.push({ id: Date.now(), text: input.value.trim(), completed: false });
  input.value = '';
  saveState();
  renderTasks();
}

function toggleTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (task) task.completed = !task.completed;
  saveState();
  renderTasks();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState();
  renderTasks();
}

function addNote() {
  const input = document.getElementById('noteInput');
  if (!input.value.trim()) return;
  state.notes.push({ id: Date.now(), text: input.value.trim(), date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
  input.value = '';
  saveState();
  renderNotes();
}

function deleteNote(id) {
  state.notes = state.notes.filter(n => n.id !== id);
  saveState();
  renderNotes();
}

// ==========================================
// 6. UI 渲染畫面更新
// ==========================================
function renderTasks() {
  const list = document.getElementById('taskList');
  list.innerHTML = state.tasks.map(t => `
    <li class="${t.completed ? 'completed' : ''}">
      <span onclick="toggleTask(${t.id})" style="cursor:pointer;">${t.completed ? '☑' : '☐'} ${t.text}</span>
      <button class="delete-btn" onclick="deleteTask(${t.id})">🗑</button>
    </li>
  `).join('');
}

function renderNotes() {
  const list = document.getElementById('noteList');
  list.innerHTML = state.notes.map(n => `
    <li>
      <span>[${n.date}] ${n.text}</span>
      <button class="delete-btn" onclick="deleteNote(${n.id})">🗑</button>
    </li>
  `).join('');
}

function renderGallery() {
  const grid = document.getElementById('stoneGallery');
  if (state.userProgress.collectedStones.length === 0) {
    grid.innerHTML = '<div style="color:#a0a0a0; grid-column:1/-1; text-align:center; padding: 20px 0;">尚未採集任何石頭...</div>';
    return;
  }
  grid.innerHTML = state.userProgress.collectedStones.map(s => `
    <div class="gallery-item">
      <div style="font-size:1.2rem;">🪨</div>
      <div style="color:${s.color}; font-weight:bold;">${s.name}</div>
    </div>
  `).join('');
}

function renderAchievements() {
  const list = document.getElementById('achievementList');
  list.innerHTML = ACHIEVEMENTS.map(a => {
    const unlocked = state.userProgress.unlockedAchievements.includes(a.id);
    return `<div class="badge ${unlocked ? 'unlocked' : ''}">${unlocked ? '🏆' : '🔒'} ${a.name}</div>`;
  }).join('');
}

function updateUI() {
  document.getElementById('streakDays').innerText = state.userProgress.streakDays;
  document.getElementById('totalDays').innerText = state.userProgress.totalDays;
  document.getElementById('stoneCount').innerText = state.userProgress.collectedStones.length;

  const todayStr = new Date().toDateString();
  const isCheckedIn = state.userProgress.lastCheckInDate === todayStr;
  const btn = document.getElementById('checkInBtn');
  btn.disabled = isCheckedIn;
  btn.innerText = isCheckedIn ? '今日已採集' : '每日採集石頭';

  renderTasks();
  renderNotes();
  renderGallery();
  renderAchievements();

  // 如果已有石頭，預設繪製最新獲得的一顆
  if (state.userProgress.collectedStones.length > 0) {
    const lastStone = state.userProgress.collectedStones[state.userProgress.collectedStones.length - 1];
    renderCanvas(lastStone);
  } else {
    renderCanvas(STONES.RIVER_PEBBLE);
  }
}

// 初始化
window.onload = () => {
  loadState();
  
  document.getElementById('checkInBtn').addEventListener('click', handleCheckIn);
  document.getElementById('addTaskBtn').addEventListener('click', addTask);
  document.getElementById('addNoteBtn').addEventListener('click', addNote);

  updateUI();
};
</script>
</body>
</html>
