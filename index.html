<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>每日簽到罐</title>
  
  <!-- 網頁與手機桌面 App 圖示設定 -->
  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuaWueWPo+eUn+iXhuW3rCIsCiAgInNob3J0X25hbWUiOiAi5Lnv5oee5qGIIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmOGZhZmMiLAogICJ0aGVtZV9jb2xvciI6ICI0ZjQ2ZTUiCn0=">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes dropIn {
      0% { transform: translateY(-180px) scale(0.6) rotate(-10deg); opacity: 0; }
      70% { transform: translateY(10px) scale(1.05) rotate(5deg); opacity: 1; }
      100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-drop { animation: dropIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    /* 星形石頭樣式與彩虹漸變動畫 */
    .star-stone {
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: linear-gradient(45deg, #ff007f, #ff7f00, #ffee00, #00ff7f, #00bfff, #8b00ff);
      background-size: 300% 300%;
      animation: rainbowGlow 3s ease infinite;
    }
    @keyframes rainbowGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans select-none max-w-md mx-auto">

  <!-- 頂部標題與備份按鈕 -->
  <header class="w-full flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-3">
    <div>
      <h1 class="text-lg font-bold text-slate-800 tracking-wide">每日簽到罐</h1>
      <p id="user-status" class="text-xs text-slate-400 mt-0.5">紀錄每天的小成就</p>
    </div>
    <div class="flex gap-2">
      <button onclick="exportData()" title="備份" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 text-xs font-medium px-2.5">
        📤 備份
      </button>
      <label title="還原" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 text-xs font-medium px-2.5 cursor-pointer">
        📥 還原 <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
      </label>
    </div>
  </header>

  <!-- 主內容區塊：罐子與任務 -->
  <main class="w-full flex-1 flex flex-col gap-3 mb-3">
    
    <!-- 1. 簽到罐區塊 -->
    <div class="flex flex-col items-center gap-2 bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm">
      <div class="relative w-56 h-56 border-4 border-slate-700/80 rounded-b-3xl bg-white/60 backdrop-blur-md shadow-inner overflow-hidden flex flex-col justify-end p-3">
        <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-40 h-3 bg-slate-300 rounded-full border border-slate-400/50 z-20"></div>
        <div id="jar-content" class="w-full h-full flex flex-wrap-reverse content-start justify-center gap-2 overflow-y-auto pt-4 no-scrollbar"></div>
      </div>
      <div class="flex items-center justify-between w-full px-2 text-slate-600 font-medium text-sm">
        <span>已累積石頭：</span>
        <span class="text-xl font-black text-indigo-600" id="stone-count">0</span>
      </div>
    </div>

    <!-- 2. 自訂任務清單區塊 -->
    <div class="flex flex-col gap-2.5 bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-slate-700 text-xs">📋 今日任務清單</h2>
        <span class="text-[10px] text-slate-400">勾選代表今日完成</span>
      </div>
      
      <!-- 新增自訂任務輸入框 -->
      <div class="flex gap-2">
        <input type="text" id="new-task-name" placeholder="新增任務..." class="flex-1 px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs bg-white text-slate-800">
        <button onclick="addNewCustomTask()" class="bg-indigo-600 text-white px-3 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">新增</button>
      </div>

      <!-- 任務清單列表 -->
      <div id="custom-task-list" class="flex flex-col gap-1.5 max-h-32 overflow-y-auto pr-1">
        <!-- 動態產生 -->
      </div>

      <!-- 3. 今日筆記/心得記錄框 -->
      <div class="pt-2 border-t border-slate-100 flex flex-col gap-1">
        <label for="daily-note" class="text-[11px] font-bold text-slate-600">✍️ 今日筆記／想記錄的事（選填）：</label>
        <input type="text" id="daily-note" placeholder="例如：今天心情很棒、體重破紀錄..." class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs bg-slate-50 text-slate-800">
      </div>
    </div>

  </main>

  <!-- 底部簽到提交按鈕 -->
  <footer class="w-full">
    <button id="checkin-btn" onclick="doCheckIn()" class="w-full py-3.5 bg-indigo-600 active:bg-indigo-700 text-white font-bold text-base rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center gap-2">
      <span>🪨 提交今日任務並丟入石頭</span>
    </button>
  </footer>

  <script>
    const COLORS = ['#ffffff', '#cbd5e1', '#64748b', '#f87171', '#fb923c', '#fbbf24', '#34d399', '#38bdf8', '#818cf8', '#c084fc', '#f472b6'];
    
    let state = { 
      count: 0, 
      lastDate: "", 
      stones: [], 
      customTasks: [
        { id: 1, name: "雙手各拿一個壺鈴", done: false },
        { id: 2, name: "閱讀 30 分鐘", done: false }
      ] 
    };

    function init() {
      const saved = localStorage.getItem('daily_jar_data_v2');
      if (saved) {
        state = JSON.parse(saved);
        const today = new Date().toLocaleDateString();
        if (state.lastResetDate !== today) {
          state.customTasks.forEach(t => t.done = false);
          state.lastResetDate = today;
          saveData();
        }
      }
      renderStones();
      renderCustomTasks();
      checkTodayStatus();
    }

    function addNewCustomTask() {
      const input = document.getElementById('new-task-name');
      const name = input.value.trim();
      if (!name) return;

      state.customTasks.push({ id: Date.now(), name: name, done: false });
      input.value = '';
      saveData();
      renderCustomTasks();
    }

    function toggleTaskDone(id) {
      const task = state.customTasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        saveData();
        renderCustomTasks();
      }
    }

    function deleteCustomTask(id) {
      state.customTasks = state.customTasks.filter(t => t.id !== id);
      saveData();
      renderCustomTasks();
    }

    function renderCustomTasks() {
      const container = document.getElementById('custom-task-list');
      container.innerHTML = '';

      if (state.customTasks.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">目前無任務，在上方新增一個吧！</p>';
        return;
      }

      state.customTasks.forEach(task => {
        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-2 rounded-xl border transition-all ${task.done ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-700'}`;
        
        item.innerHTML = `
          <label class="flex items-center gap-2 flex-1 cursor-pointer">
            <input type="checkbox" ${task.done ? 'checked' : ''} onclick="toggleTaskDone(${task.id})" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
            <span class="text-xs font-medium ${task.done ? 'line-through opacity-75' : ''}">${task.name}</span>
          </label>
          <button onclick="deleteCustomTask(${task.id})" class="text-slate-400 hover:text-red-500 px-1.5 py-0.5 text-xs">🗑️</button>
        `;
        container.appendChild(item);
      });
    }

    function checkTodayStatus() {
      const today = new Date().toLocaleDateString();
      const btn = document.getElementById('checkin-btn');
      const noteInput = document.getElementById('daily-note');
      
      if (state.lastDate === today) {
        btn.disabled = true;
        btn.classList.replace('bg-indigo-600', 'bg-slate-300');
        btn.classList.remove('shadow-indigo-200', 'active:scale-95');
        btn.innerHTML = '<span>✅ 今日已完成簽到與丟石頭</span>';
        if (noteInput) noteInput.disabled = true;
      }
    }

    function doCheckIn() {
      const today = new Date().toLocaleDateString();
      if (state.lastDate === today) return;

      const noteInput = document.getElementById('daily-note');
      const userNote = noteInput ? noteInput.value.trim() : "";

      // 觸發 3.3% 隱藏稀有彩虹星形石頭
      const isRareStar = Math.random() < 0.033; 

      let randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      let randomShape = Math.floor(Math.random() * 5); 
      
      if (isRareStar) {
        randomShape = 99; 
      }

      state.count += 1;
      state.lastDate = today;
      // 記錄日期與當下紀錄的文字 (note)
      state.stones.push({ 
        date: today, 
        note: userNote,
        color: randomColor, 
        shape: randomShape, 
        isRare: isRareStar 
      });

      saveData();
      renderStones(true);
      checkTodayStatus();

      if (isRareStar) {
        setTimeout(() => {
          alert('🎉 恭喜你！今天幸運獲得了【超稀有彩虹星形石頭】⭐！');
        }, 600);
      }
    }

    function renderStones(animateLast = false) {
      const container = document.getElementById('jar-content');
      document.getElementById('stone-count').innerText = state.count;
      container.innerHTML = '';

      state.stones.forEach((stone, index) => {
        const el = document.createElement('div');
        
        if (stone.shape === 99 || stone.isRare) {
          el.className = `w-9 h-9 star-stone shadow-lg flex-shrink-0 cursor-pointer transition-transform hover:scale-125 z-10`;
        } else {
          let shapeClass = 'rounded-full';
          if (stone.shape === 1) shapeClass = 'rounded-lg transform rotate-12';
          if (stone.shape === 2) shapeClass = 'rounded-2xl transform -rotate-6';
          if (stone.shape === 3) shapeClass = 'rounded-tl-2xl rounded-br-2xl transform rotate-45';
          if (stone.shape === 4) shapeClass = 'rounded-tr-2xl rounded-bl-2xl transform -rotate-12';

          el.className = `w-9 h-9 ${shapeClass} shadow-md border border-black/10 flex-shrink-0 cursor-pointer transition-transform hover:scale-110`;
          el.style.backgroundColor = stone.color;
        }

        // 點擊石頭僅顯示日期與當時紀錄的文字
        el.onclick = () => {
          const rareHeader = stone.isRare ? '⭐【超稀有彩虹星】\n' : '';
          const stoneDate = stone.date || '早期紀錄';
          const noteText = stone.note ? `\n📝 紀錄文字：${stone.note}` : '\n📝 紀錄文字：無';
          
          alert(`${rareHeader}🗓️ 簽到日期：${stoneDate}${noteText}`);
        };

        if (animateLast && index === state.stones.length - 1) {
          el.classList.add('animate-drop');
        }
        container.appendChild(el);
      });
    }

    function saveData() {
      localStorage.setItem('daily_jar_data_v2', JSON.stringify(state));
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `daily_jar_backup_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          state = JSON.parse(e.target.result);
          saveData();
          renderStones();
          renderCustomTasks();
          checkTodayStatus();
          alert('資料還原成功！');
        } catch (err) {
          alert('檔案格式錯誤！');
        }
      };
      reader.readAsText(file);
    }

    window.onload = init;
  </script>
</body>
</html>
